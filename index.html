<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243e36"><link rel="manifest" href="manifest.webmanifest"><title>BauManager Rüeggisberg</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#22352e;background:#f4f5f0}*{box-sizing:border-box}body{margin:0}header{background:#243e36;color:white;padding:18px 24px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}header small{opacity:.8}nav{display:flex;gap:7px;overflow:auto;padding:12px;background:#e8ece6}button,.btn{border:1px solid #aebcb3;border-radius:8px;padding:9px 12px;background:white;color:#243e36;cursor:pointer;font:inherit}button.active,.primary{background:#27644f;color:white;border-color:#27644f}main{max-width:1250px;margin:auto;padding:22px}h1{margin:0;font-size:23px}h2{margin:8px 0 16px}h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}.card{background:white;border:1px solid #e0e5dd;border-radius:12px;padding:17px;margin-bottom:14px}.metric{font-size:25px;font-weight:750}.muted{color:#64766d;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid #e3e8e1;text-align:left}th{background:#f1f5f1}.scroll{overflow:auto}input,select,textarea{padding:9px;border:1px solid #b9c8bc;border-radius:7px;font:inherit;max-width:100%;width:100%}label{font-size:13px;font-weight:600;display:block;margin:9px 0 4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{display:inline-block;border-radius:20px;background:#e7f0e8;padding:4px 9px;font-size:12px}.warn{color:#a34b24}.hide{display:none}.empty{padding:22px;color:#68786d;text-align:center}footer{padding:20px;text-align:center;font-size:12px;color:#64766d}@media(max-width:600px){main{padding:12px}header{padding:15px}td,th{padding:8px}}

/* Farbcodierung der sechs Rubriken: Navigation, Überschriften und Inhaltskarten */
nav button[data-page]{font-weight:650;border:1px solid transparent;border-left:5px solid var(--module-color);background:var(--module-pale);color:var(--module-ink);transition:filter .15s,transform .15s}
nav button[data-page]:hover{filter:brightness(.96)}
nav button[data-page].active{background:var(--module-color);color:#fff;border-color:var(--module-color)}
nav button[data-page="dashboard"],body[data-section="dashboard"]{--module-color:#27644f;--module-pale:#e1f2e9;--module-ink:#164c3a}
nav button[data-page="finanzen"],body[data-section="finanzen"]{--module-color:#225eae;--module-pale:#e5efff;--module-ink:#19467d}
nav button[data-page="offerten"],body[data-section="offerten"]{--module-color:#a56316;--module-pale:#fff0d8;--module-ink:#78440d}
nav button[data-page="dokumente"],body[data-section="dokumente"]{--module-color:#7550a3;--module-pale:#f0e8fa;--module-ink:#59357d}
nav button[data-page="aufgaben"],body[data-section="aufgaben"]{--module-color:#b24555;--module-pale:#ffebee;--module-ink:#8a2c3b}
nav button[data-page="bautagebuch"],body[data-section="bautagebuch"]{--module-color:#087b83;--module-pale:#def5f4;--module-ink:#075a61}
#app>h2{border-left:7px solid var(--module-color);background:var(--module-pale);color:var(--module-ink);padding:12px 16px;border-radius:0 9px 9px 0}
#app>.card{border-top:4px solid var(--module-color)}
#app .grid>.card{border-top:4px solid var(--module-color)}
#app h3{color:var(--module-ink)}
#app .primary{background:var(--module-color);border-color:var(--module-color)}
#app th{background:var(--module-pale);color:var(--module-ink)}
@media(max-width:600px){nav button[data-page]{flex-shrink:0}}

.subrow{background:#f6f9fe}.subrow td:first-child{padding-left:30px}.subpanel{margin:12px 0;padding:14px;border:1px solid #b9d2ee;border-radius:9px;background:#f5f9ff}.subpanel h4{margin:0 0 8px;color:#19467d}.subform{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px 12px}.subform label{margin-top:0}.smallbtn{padding:6px 9px;font-size:13px}.subhint{font-size:12px;color:#526779}.parentrow{background:#f9fbff;font-weight:600}.subdetails{margin-top:5px;font-size:12px;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere;color:#526779}.productlink{display:inline-block;margin-top:5px;color:#165aa5;text-decoration:underline;overflow-wrap:anywhere}.subform textarea{min-height:90px;resize:vertical}.subform .full{grid-column:1/-1}.areahead td{background:#dce9fa;border-top:2px solid #225eae;color:#19467d;padding:13px}.areaamounts{font-size:13px;margin-top:5px;font-weight:500}.areahead .muted{margin-left:8px}
 .photo-grid{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}.photo-item{position:relative;width:112px}.photo-item img{width:112px;height:88px;object-fit:cover;border-radius:8px;border:1px solid #c4d2df;display:block}.photo-item button{margin-top:4px;font-size:12px;padding:5px;width:100%}.photo-item a{display:block}.photo-help{font-size:12px;color:#526779}.photo-error{color:#a12b22;font-weight:600;font-size:13px} </style></head><body><header><div><h1>⌂ BauManager Rüeggisberg</h1><small>Totalsanierung · Projektsteuerung und Kostenkontrolle</small></div><div><span id="status">● Lokal gespeichert</span><div class="muted" style="color:#e1e8e0">Version 1.2 · Offline-Prototyp</div></div></header><nav id="nav"></nav><main id="app"></main><footer>Lokale Testversion · Daten bleiben auf diesem Gerät. Für gemeinsame Cloud-Synchronisation ist eine spätere Serveranbindung erforderlich.</footer><script>
const modules=[['dashboard','Übersicht'],['finanzen','Finanzen'],['offerten','Offerten'],['dokumente','Dokumente'],['aufgaben','Aufgaben'],['bautagebuch','Bautagebuch']];
const definitions={gewerke:{title:'Gewerke',fields:[['name','Gewerk','text'],['status','Status','choice:Geplant|Offerten einholen|Beauftragt|In Arbeit|Abgeschlossen'],['notiz','Bemerkungen','text']]},handwerker:{title:'Handwerker und Kontakte',fields:[['name','Firma / Name','text'],['gewerk','Gewerk','text'],['kontakt','Telefon / E-Mail','text'],['notiz','Bemerkungen','text']]},finanzen:{title:'Finanzpositionen',fields:[['name','Kostenposition','text'],['bereich','Gebäudebereich / Etage','area'],['gewerk','Unternehmen','text'],['budget','Budget CHF','number'],['effektiv','Effektive Kosten CHF','number'],['bezahlt','Bezahlt CHF','number']]},bauzeitenplan:{title:'Bauzeitenplan',fields:[['name','Arbeit / Meilenstein','text'],['start','Beginn','date'],['ende','Ende','date'],['status','Status','choice:Geplant|In Arbeit|Abgeschlossen'],['abhaengigkeit','Abhängigkeit / Voraussetzung','text']]},offerten:{title:'Offertenvergleich',fields:[['name','Angebot / Leistung','text'],['firma','Anbieter','text'],['gewerk','Gewerk','text'],['betrag','Betrag CHF','number'],['status','Status','choice:Angefragt|Eingegangen|In Prüfung|Angenommen|Abgelehnt'],['datum','Datum','date']]},dokumente:{title:'Dokumentenregister',fields:[['name','Dokumenttitel','text'],['typ','Kategorie','choice:Plan|Vertrag|Offerte|Rechnung|Foto|Protokoll|Sonstiges'],['ablage','Ablageort / Link / Dateiname','text'],['notiz','Bemerkungen','text']]},aufgaben:{title:'Aufgaben und Pendenzen',fields:[['name','Aufgabe','text'],['zustaendig','Zuständig','text'],['faellig','Fällig','date'],['prioritaet','Priorität','choice:Hoch|Mittel|Tief'],['status','Status','choice:Offen|In Arbeit|Erledigt']]},bautagebuch:{title:'Bautagebuch',fields:[['datum','Datum','date'],['name','Eintrag / Ereignis','text'],['gewerk','Gewerk','text'],['notiz','Details','text']]},maengel:{title:'Mängelmanagement',fields:[['name','Mangel','text'],['gewerk','Gewerk','text'],['zustaendig','Zuständig','text'],['faellig','Frist','date'],['status','Status','choice:Offen|Gemeldet|In Behebung|Behoben'],['notiz','Beschreibung','text']]}};
let data;try{data=JSON.parse(localStorage.getItem('baumanager-v1'))||{}}catch{data={}}for(const k of Object.keys(definitions))if(!Array.isArray(data[k]))data[k]=[];// Einmalige, rückwärtskompatible Übernahme bisheriger Finanzdaten.
// Die alten Werte bleiben in den Datensätzen erhalten, werden aber nicht mehr bearbeitet.
function migrateFinanzen(obj){if(!Array.isArray(obj.finanzen))return obj;for(const r of obj.finanzen){if(r.effektiv===undefined || r.effektiv===null || r.effektiv===''){r.effektiv=(Number(r.vergeben)||0)+(Number(r.nachtrag)||0)}}return obj}
migrateFinanzen(data);let page='dashboard',editId=null,subParentId=null,subEditId=null,areaFilter='Alle Bereiche',pendingPhotos=[],pendingOfferPdf=null;
const defaultAreas=['Untergeschoss','Erdgeschoss','Obergeschoss','Galerie','Dach / Estrich','Aussenbereich','Gebäudeübergreifend'];
const getArea=r=>String(r.bereich||'Nicht zugeordnet').trim()||'Nicht zugeordnet';
const areaNames=()=>[...new Set([...defaultAreas,...data.finanzen.map(getArea)])].sort((a,b)=>a.localeCompare(b,'de-CH'));
function groupedFinance(rows){const names=[...new Set(rows.map(getArea))].sort((a,b)=>a.localeCompare(b,'de-CH'));return names.map(name=>{const group=rows.filter(r=>getArea(r)===name);return `<tr class="areahead"><td colspan="6"><strong>${esc(name)}</strong> <span class="muted">${group.length} Kostenposition(en)</span><div class="areaamounts">Budget ${fmt(sum(group,'budget'))} · Effektive Kosten ${fmt(sum(group,'effektiv'))} · Bezahlt ${fmt(sum(group,'bezahlt'))}</div></td></tr>${financeRows(group)}`}).join('')}
const safeLink=u=>{try{const x=new URL(String(u||'').trim());return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};const fmt=n=>new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('baumanager-v1',JSON.stringify(data));document.querySelector('#status').textContent='● Lokal gespeichert'}catch{document.querySelector('#status').textContent='⚠ Speicher voll – Daten exportieren'}};const effectiveValue=(r,k)=>Array.isArray(r.unterpositionen)&&r.unterpositionen.length?r.unterpositionen.reduce((s,u)=>s+(Number(u[k])||0),0):(Number(r[k])||0);const sum=(a,k)=>a.reduce((s,x)=>s+effectiveValue(x,k),0);
function render(){document.body.dataset.section=page;document.querySelector('#nav').innerHTML=modules.map(([k,t])=>`<button data-page="${k}" class="${k===page?'active':''}">${t}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editId=null;subParentId=null;subEditId=null;pendingPhotos=[];pendingOfferPdf=null;render()});document.querySelector('#app').innerHTML=page==='dashboard'?dashboard():section(page);bind()}
function dashboard(){let f=data.finanzen,b=sum(f,'budget'),v=sum(f,'effektiv'),p=sum(f,'bezahlt');let tasks=data.aufgaben.filter(x=>x.status!=='Erledigt');return `<h2>Projektübersicht</h2><div class="grid"><div class="card"><div class="muted">Gesamtbudget</div><div class="metric">${fmt(b)}</div></div><div class="card"><div class="muted">Effektive Kosten</div><div class="metric">${fmt(v)}</div></div><div class="card"><div class="muted">Bezahlt</div><div class="metric">${fmt(p)}</div></div><div class="card"><div class="muted">Verbleibendes Budget</div><div class="metric ${b-v<0?'warn':''}">${fmt(b-v)}</div></div></div><div class="grid"><div class="card"><h3>Offene Aufgaben</h3><div class="metric">${tasks.length}</div>${tasks.slice(0,5).map(x=>`<p>• ${esc(x.name)} <span class="muted">${esc(x.faellig)}</span></p>`).join('')||'<p class="muted">Keine offenen Aufgaben</p>'}</div><div class="card"><h3>Projektbestand</h3><p>${data.offerten.length} Offerten · ${data.dokumente.length} Dokumente</p><p>${data.bautagebuch.length} Tagebucheinträge · ${data.aufgaben.length} Aufgaben</p></div></div><div class="card"><h3>Datensicherung</h3><p>Diese Testversion speichert ausschliesslich im Browser dieses Geräts. Regelmässig eine JSON-Sicherung exportieren. Keine automatische Synchronisation zwischen Geräten.</p><div class="actions"><button class="primary" id="export">Daten exportieren (JSON)</button><label style="margin:0"><span class="btn" style="display:inline-block">Daten importieren</span><input type="file" id="import" accept=".json,application/json" style="display:none"></label></div></div>`}
function financeRows(rows){return rows.map(r=>{const subs=Array.isArray(r.unterpositionen)?r.unterpositionen:[];const isOpen=subParentId===r.id;const cols=['budget','effektiv','bezahlt'];return `<tr class="parentrow"><td>${esc(r.name)} ${subs.length?`<span class="tag">${subs.length} Unterposition(en)</span>`:''}</td><td>${esc(r.gewerk)}</td>${cols.map(key=>`<td>${fmt(effectiveValue(r,key))}</td>`).join('')}<td><button class="smallbtn" data-toggle-sub="${esc(r.id)}">${isOpen?'Schliessen':'Unterpositionen'}</button> <button class="smallbtn" data-edit="${esc(r.id)}">Bearbeiten</button> <button class="smallbtn" data-delete="${esc(r.id)}">Löschen</button></td></tr>${subs.map(u=>`<tr class="subrow"><td>↳ ${esc(u.name)}${u.bemerkungen?`<div class="subdetails">${esc(u.bemerkungen)}</div>`:''}${photoGallery(u.bilder||[],false)}${safeLink(u.produktlink)?`<a class="productlink" href="${esc(safeLink(u.produktlink))}" target="_blank" rel="noopener noreferrer">↗ Produktwebsite öffnen</a>`:''}</td><td>${esc(u.gewerk||r.gewerk)}</td>${cols.map(key=>`<td>${fmt(u[key])}</td>`).join('')}<td><button class="smallbtn" data-sub-edit="${esc(r.id)}|${esc(u.id)}">Bearbeiten</button> <button class="smallbtn" data-sub-delete="${esc(r.id)}|${esc(u.id)}">Löschen</button></td></tr>`).join('')}${isOpen?subEditor(r):''}`}).join('')}
function photoGallery(bilder,editable){return Array.isArray(bilder)&&bilder.length?`<div class="photo-grid">${bilder.filter(x=>x&&typeof x.data==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(x.data)).map((x,i)=>`<div class="photo-item"><a href="${esc(x.data)}" target="_blank" rel="noopener" aria-label="Bild ${i+1} gross öffnen"><img src="${esc(x.data)}" alt="${esc(x.name||'Produktbild')}" loading="lazy"></a>${editable?`<button type="button" data-remove-photo="${i}" aria-label="Bild ${i+1} entfernen">Entfernen</button>`:''}</div>`).join('')}</div>`:''}
async function shrinkPhoto(file){if(!file.type.startsWith('image/'))throw Error('Bitte eine Bilddatei wählen.');if(file.size>12*1024*1024)throw Error('Bild grösser als 12 MB.');const blob=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let scale=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(Error('Bild konnte nicht verarbeitet werden.'))},'image/jpeg',.68)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Bild kann nicht geöffnet werden.'))};img.src=url});const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Bild konnte nicht gelesen werden.'));reader.readAsDataURL(blob)});return {name:file.name.slice(0,100),data};}
function refreshPhotoPreview(){const el=document.querySelector('#photo-preview');if(el)el.innerHTML=photoGallery(pendingPhotos,true)+'<p class="photo-help">'+pendingPhotos.length+' von maximal 5 Bildern. Bilder werden für die lokale Speicherung verkleinert.</p>';document.querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=()=>{pendingPhotos.splice(Number(b.dataset.removePhoto),1);refreshPhotoPreview()})}
function subEditor(r){let u=(r.unterpositionen||[]).find(x=>x.id===subEditId)||{};return `<tr><td colspan="6"><div class="subpanel"><h4>${subEditId?'Unterposition bearbeiten':'Unterposition zu «'+esc(r.name)+'» hinzufügen'}</h4><p class="subhint">Sobald Unterpositionen vorhanden sind, ergeben sich die Summen dieser Kostenposition ausschliesslich aus den Unterpositionen. Die bisherigen Hauptbeträge bleiben als Reserve gespeichert.</p><form id="subentry"><div class="subform"><div><label>Bezeichnung<input name="name" required value="${esc(u.name)}"></label></div><div><label>Unternehmen<input name="gewerk" value="${esc(u.gewerk||'')}"></label></div>${[['budget','Budget CHF'],['effektiv','Effektive Kosten CHF'],['bezahlt','Bezahlt CHF']].map(([key,title])=>`<div><label>${title}<input name="${key}" type="number" min="0" step="0.01" value="${esc(u[key]??0)}"></label></div>`).join('')}<div class="full"><label>Bemerkungen<textarea name="bemerkungen" placeholder="Material, Modell, Farbe, Lieferbedingungen, Entscheidungen …">${esc(u.bemerkungen||'')}</textarea></label></div><div class="full"><label for="subphotos">Bilder zu den Bemerkungen (max. 5)</label><input id="subphotos" type="file" accept="image/*" multiple><div id="photo-preview"></div><p id="photo-error" class="photo-error" role="alert"></p></div><div class="full"><label>Link zur Produktwebsite<input name="produktlink" type="url" inputmode="url" placeholder="https://www.beispiel.ch/produkt" value="${esc(u.produktlink||'')}"></label><div class="subhint">Optional. Ein vollständiger Link mit https:// oder http:// wird anklickbar angezeigt.</div></div></div><div class="actions"><button class="primary" type="submit">${subEditId?'Änderungen speichern':'Unterposition hinzufügen'}</button><button id="subcancel" type="button">Abbrechen</button></div></form></div></td></tr>`}
function offerPdfField(current){const pdf=current.pdf&&typeof current.pdf.data==='string'?current.pdf:null;return `<div class="wide"><label for="offer-pdf">Offerte als PDF hinterlegen (max. 2 MB)</label><input id="offer-pdf" type="file" accept=".pdf,application/pdf"><p class="subhint">Eine PDF-Datei pro Offerte. Beim Bearbeiten kann sie ersetzt oder entfernt werden. Die Datei wird in der JSON-Sicherung mitgespeichert.</p><div id="offer-pdf-preview">${pdf?`Aktuelle Datei: <strong>${esc(pdf.name)}</strong> · <button type="button" class="smallbtn" id="offer-pdf-remove">PDF entfernen</button>`:'Noch keine PDF hinterlegt.'}</div><p class="photo-error" id="offer-pdf-error" role="alert"></p></div>`}
function offerPdfLink(r){const pdf=r.pdf;if(!pdf||typeof pdf.data!=='string'||!pdf.data.startsWith('data:application/pdf;base64,'))return '';return `<div class="subdetails">📄 ${esc(pdf.name||'Offerte.pdf')} · <button type="button" class="smallbtn" data-offer-pdf="${esc(r.id)}">PDF öffnen / sichern</button></div>`}
function openOfferPdf(pdf){
  try{
    if(!pdf||typeof pdf.data!=='string'||!/^data:application\/pdf;base64,/.test(pdf.data))throw Error('Ungültige PDF-Daten.');
    const binary=atob(pdf.data.split(',')[1]);const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    // Safari öffnet PDF-Blob-URLs in einem regulären HTTPS-Kontext.
    // Der alternative Download bleibt verfügbar, falls Pop-ups blockiert werden.
    let old=document.getElementById('pdf-actions');if(old){if(old.dataset.url)URL.revokeObjectURL(old.dataset.url);old.remove()}
    const box=document.createElement('section');box.id='pdf-actions';box.dataset.url=url;
    box.style.cssText='margin:16px 0;padding:16px;border:2px solid #a96a13;border-radius:10px;background:#fff';
    const title=document.createElement('h3');title.textContent='PDF: '+(pdf.name||'Offerte.pdf');box.appendChild(title);
    const hint=document.createElement('p');hint.textContent='PDF in Safari öffnen oder über Teilen / In Dateien sichern. Falls das Öffnen blockiert wird, die Datei über den zweiten Knopf herunterladen.';box.appendChild(hint);
    const open=document.createElement('a');open.href=url;open.target='_blank';open.rel='noopener';open.textContent='PDF in neuem Tab öffnen';open.className='smallbtn';open.style.cssText='display:inline-block;margin:5px';box.appendChild(open);
    const download=document.createElement('a');download.href=url;download.download=(pdf.name||'Offerte.pdf').replace(/[\/\\]/g,'_');download.textContent='PDF herunterladen';download.className='smallbtn';download.style.cssText='display:inline-block;margin:5px';box.appendChild(download);
    const close=document.createElement('button');close.type='button';close.textContent='Schliessen';close.onclick=()=>{URL.revokeObjectURL(url);box.remove()};box.appendChild(close);
    document.getElementById('app').prepend(box);box.scrollIntoView({block:'start'});
  }catch(e){alert('PDF konnte nicht geöffnet werden: '+e.message)}
}
function readOfferPdf(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>2*1024*1024)return reject(Error('Die PDF ist grösser als 2 MB.'));if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf')return reject(Error('Bitte eine PDF-Datei auswählen.'));const reader=new FileReader();reader.onerror=()=>reject(Error('PDF konnte nicht gelesen werden.'));reader.onload=()=>{const value=String(reader.result||'');if(!value.startsWith('data:application/pdf;base64,'))return reject(Error('Ungültiges PDF-Format.'));resolve({name:file.name.slice(0,160),data:value,size:file.size})};reader.readAsDataURL(file)})}
function section(k){let d=definitions[k],rows=data[k],current=rows.find(x=>x.id===editId)||{};return `<h2>${d.title}</h2><div class="card"><h3>${editId?'Eintrag bearbeiten':'Neuen Eintrag erfassen'}</h3><form id="entry"><div class="form">${d.fields.map(([key,label,type])=>`<div class="${key==='notiz'?'wide':''}"><label for="f_${key}">${label}</label>${type==='area'?`<input id="f_${key}" name="${key}" list="bereich-optionen" placeholder="z. B. Untergeschoss" value="${esc(current[key]||'')}"><datalist id="bereich-optionen">${areaNames().map(a=>`<option value="${esc(a)}"></option>`).join('')}</datalist>`:type.startsWith('choice:')?`<select id="f_${key}" name="${key}">${type.slice(7).split('|').map(o=>`<option ${current[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${key}" name="${key}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${esc(current[key])}" ${key==='name'?'required':''}>`}</div>`).join('')}${k==='offerten'?offerPdfField(current):''}</div><div class="actions"><button class="primary" type="submit">${editId?'Änderungen speichern':'Eintrag hinzufügen'}</button>${editId?'<button type="button" id="cancel">Abbrechen</button>':''}</div></form></div><div class="card scroll"><h3>Einträge (${rows.length})</h3>${k==='finanzen'?`<label for="area-filter">Nach Gebäudebereich filtern</label><select id="area-filter"><option value="Alle Bereiche">Alle Bereiche</option>${areaNames().map(a=>`<option value="${esc(a)}" ${areaFilter===a?'selected':''}>${esc(a)}</option>`).join('')}</select><p class="subhint">Bereiche lassen sich beim Erfassen oder Bearbeiten frei benennen. Alle Kosten werden je Bereich und für das Gesamtprojekt summiert.</p>`:''}${rows.length?`<table><thead><tr>${(k==='finanzen'?d.fields.filter(x=>x[0]!=='bereich'):d.fields).map(x=>`<th>${esc(x[1])}</th>`).join('')}<th>Aktionen</th></tr></thead><tbody>${k==='finanzen'?groupedFinance(areaFilter==='Alle Bereiche'?rows:rows.filter(r=>getArea(r)===areaFilter)):rows.map(r=>`<tr>${d.fields.map(([key,,type])=>`<td>${type==='number'?fmt(r[key]):(k==='offerten'&&key==='name'?esc(r[key])+offerPdfLink(r):esc(r[key]))}</td>`).join('')}<td><button data-edit="${r.id}">Bearbeiten</button> <button data-delete="${r.id}">Löschen</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Einträge vorhanden.</div>'}</div>${k==='finanzen'?`<div class="card"><h3>Finanzübersicht</h3><p>Budget: <strong>${fmt(sum(rows,'budget'))}</strong> · Effektive Kosten: <strong>${fmt(sum(rows,'effektiv'))}</strong> · Bezahlt: <strong>${fmt(sum(rows,'bezahlt'))}</strong></p><p>Budgetabweichung: <strong>${fmt(sum(rows,'budget')-sum(rows,'effektiv'))}</strong> · Offen: <strong>${fmt(sum(rows,'effektiv')-sum(rows,'bezahlt'))}</strong></p></div>`:''}`}
// Zwei-Klick-Bestaetigung statt Browser-Dialog: funktioniert auch bei lokal geoeffneten HTML-Dateien auf iOS.
function confirmDelete(button,label){
 if(button.dataset.armed==='yes')return true;
 document.querySelectorAll('[data-delete],[data-sub-delete]').forEach(other=>{
   if(other!==button && other.dataset.armed==='yes'){
     other.dataset.armed='no';other.textContent='Löschen';other.removeAttribute('aria-label');
   }
 });
 button.dataset.armed='yes';button.textContent='Wirklich löschen?';
 button.setAttribute('aria-label',label+' endgültig löschen – erneut drücken');
 button.style.borderColor='#b42318';button.style.color='#b42318';
 return false;
}
function bind(){const pdfInput=document.querySelector('#offer-pdf');if(pdfInput){const current=data.offerten.find(x=>x.id===editId)||{};pendingOfferPdf=current.pdf||null;const preview=document.querySelector('#offer-pdf-preview');const error=document.querySelector('#offer-pdf-error');const showPdf=()=>{preview.innerHTML=pendingOfferPdf?`Ausgewählt: <strong>${esc(pendingOfferPdf.name)}</strong> · <button type="button" class="smallbtn" id="offer-pdf-remove">PDF entfernen</button>`:'Keine PDF hinterlegt.';const remove=document.querySelector('#offer-pdf-remove');if(remove)remove.onclick=()=>{pendingOfferPdf=null;pdfInput.value='';showPdf()}};showPdf();pdfInput.onchange=async()=>{error.textContent='';if(!pdfInput.files.length)return;try{pendingOfferPdf=await readOfferPdf(pdfInput.files[0]);showPdf()}catch(e){error.textContent=e.message;pdfInput.value=''}}}document.querySelectorAll('[data-offer-pdf]').forEach(b=>b.onclick=()=>{const r=data.offerten.find(x=>x.id===b.dataset.offerPdf);if(r?.pdf)openOfferPdf(r.pdf)});let af=document.querySelector('#area-filter');if(af)af.onchange=()=>{areaFilter=af.value;render()};document.querySelectorAll('[data-toggle-sub]').forEach(b=>b.onclick=()=>{subParentId=subParentId===b.dataset.toggleSub?null:b.dataset.toggleSub;subEditId=null;pendingPhotos=[];render()});document.querySelectorAll('[data-sub-edit]').forEach(b=>b.onclick=()=>{const [parent,id]=b.dataset.subEdit.split('|');subParentId=parent;subEditId=id;pendingPhotos=[...((data.finanzen.find(x=>x.id===parent)?.unterpositionen||[]).find(x=>x.id===id)?.bilder||[])];render()});document.querySelectorAll('[data-sub-delete]').forEach(b=>b.onclick=()=>{const [parent,id]=b.dataset.subDelete.split('|');if(!confirmDelete(b,'Unterposition'))return;let r=data.finanzen.find(x=>x.id===parent);if(!r)return;r.unterpositionen=(r.unterpositionen||[]).filter(x=>x.id!==id);subEditId=null;save();render()});let photoInput=document.querySelector('#subphotos');if(photoInput){refreshPhotoPreview();photoInput.onchange=async()=>{const msg=document.querySelector('#photo-error');msg.textContent='';photoInput.disabled=true;try{for(const file of photoInput.files){if(pendingPhotos.length>=5){msg.textContent='Maximal 5 Bilder pro Unterposition.';break}pendingPhotos.push(await shrinkPhoto(file));refreshPhotoPreview()}}catch(err){msg.textContent=err.message}finally{photoInput.value='';photoInput.disabled=false}}}let sf=document.querySelector('#subentry');if(sf)sf.onsubmit=e=>{e.preventDefault();let r=data.finanzen.find(x=>x.id===subParentId);if(!r)return;if(!Array.isArray(r.unterpositionen))r.unterpositionen=[];let o=Object.fromEntries(new FormData(sf).entries());o.bemerkungen=String(o.bemerkungen||'').trim();o.produktlink=String(o.produktlink||'').trim();o.bilder=[...pendingPhotos];if(o.produktlink&&!safeLink(o.produktlink)){alert('Bitte einen gültigen Produktlink mit https:// oder http:// eingeben.');return}for(const k of ['budget','effektiv','bezahlt'])o[k]=Math.max(0,Number(o[k])||0);if(subEditId){let i=r.unterpositionen.findIndex(x=>x.id===subEditId);if(i>=0)r.unterpositionen[i]={...r.unterpositionen[i],...o}}else r.unterpositionen.push({id:crypto.randomUUID(),...o});subEditId=null;pendingPhotos=[];save();render()};let sc=document.querySelector('#subcancel');if(sc)sc.onclick=()=>{subParentId=null;subEditId=null;pendingPhotos=[];render()};const form=document.querySelector('#entry');if(form)form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form).entries());for(let [key,,type] of definitions[page].fields)if(type==='number')o[key]=Number(o[key]||0);if(page==='finanzen')o.bereich=String(o.bereich||'').trim()||'Nicht zugeordnet';if(page==='offerten')o.pdf=pendingOfferPdf;if(editId){let idx=data[page].findIndex(x=>x.id===editId);if(idx>=0)data[page][idx]={...data[page][idx],...o,id:editId}}else data[page].push({id:crypto.randomUUID(),...o});editId=null;pendingOfferPdf=null;save();render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirmDelete(b,'Eintrag inklusive Unterpositionen'))return;data[page]=data[page].filter(x=>x.id!==b.dataset.delete);if(editId===b.dataset.delete)editId=null;if(subParentId===b.dataset.delete){subParentId=null;subEditId=null}save();render()});let c=document.querySelector('#cancel');if(c)c.onclick=()=>{editId=null;pendingOfferPdf=null;render()};let ex=document.querySelector('#export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='baumanager-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let im=document.querySelector('#import');if(im)im.onchange=async()=>{let file=im.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||typeof obj!=='object'||!Object.keys(definitions).every(k=>Array.isArray(obj[k])))throw Error('Ungültiges Sicherungsformat');if(!confirm('Bestehende lokale Daten durch die Sicherung ersetzen?'))return;data=migrateFinanzen(obj);save();render()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}}save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
